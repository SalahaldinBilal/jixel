[package]
name = "cvvdp-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Still-image ColorVideoVDP with reusable reference analysis"
license = "BSD-3-Clause OR Apache-2.0"
publish = false

[features]
default = ["avx", "neon", "sse"]
avx = []
neon = []
sse = []
# Compatibility alias for callers that enabled all SIMD backends together.
simd = ["avx", "neon", "sse"]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

